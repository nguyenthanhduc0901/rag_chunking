<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gutenberg RAG Chatbot</title>
    <link rel="stylesheet" href="/app.css" />
    <style>
      body {
        height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        background: var(--soft);
      }

      .chat-header {
        padding: 14px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }

      .chat-title {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
      }

      h1 {
        margin: 0;
        font-size: 16px;
        line-height: 1.2;
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: center;
      }

      select {
        min-width: 0;
        min-height: 36px;
        padding: 0 9px;
      }

      main {
        overflow: auto;
        padding: 14px;
      }

      .msg {
        position: relative;
        max-width: 94%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 11px;
        margin-bottom: 10px;
        background: var(--surface);
        white-space: pre-wrap;
        line-height: 1.42;
        font-size: 14px;
        box-shadow: 0 6px 18px rgba(23, 32, 29, 0.06);
      }

      .msg.user {
        margin-left: auto;
        border-color: #b7d9d0;
        background: #edf8f5;
      }

      .msg.assistant {
        margin-right: auto;
      }

      details {
        margin-top: 10px;
        border-top: 1px solid var(--line);
        padding-top: 8px;
      }

      summary {
        cursor: pointer;
        color: var(--accent);
        font-size: 13px;
        font-weight: 650;
      }

      .source {
        margin: 7px 0;
        color: var(--muted);
        font-size: 12px;
      }

      .composer {
        border-top: 1px solid var(--line);
        padding: 10px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        background: var(--surface);
      }

      textarea {
        resize: none;
        min-height: 44px;
        max-height: 120px;
        padding: 10px;
        line-height: 1.35;
      }

      #send {
        min-width: 78px;
        padding: 0 14px;
      }

      @media (max-width: 420px) {
        .chat-header {
          padding: 12px;
        }

        .controls {
          grid-template-columns: 1fr;
        }

        .status-pill {
          justify-content: center;
        }

        .msg {
          max-width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header class="chat-header">
      <div class="chat-title">
        <div>
          <h1>Gutenberg RAG Chat</h1>
          <div class="tiny">Ask over the indexed Project Gutenberg books.</div>
        </div>
        <nav class="nav" aria-label="Widget navigation">
          <a href="/chunk-playground.html" target="_blank" rel="noreferrer">Chunks</a>
        </nav>
      </div>
      <div class="controls">
        <label class="sr-only" for="chunker">Chunking method</label>
        <select id="chunker"></select>
        <span class="status-pill" id="status">Loading</span>
      </div>
    </header>

    <main id="messages">
      <div class="msg assistant">
        Ask a question about the books in this Gutenberg bookshelf. Choose a chunking method above to compare retrieval behavior.
      </div>
    </main>

    <form class="composer" id="form">
      <label class="sr-only" for="message">Question</label>
      <textarea id="message" placeholder="Ask about a book, theme, or passage"></textarea>
      <button id="send" type="submit">Send</button>
    </form>

    <script>
      const apiBase = new URL(".", window.location.href).origin;
      const chunkerSelect = document.getElementById("chunker");
      const statusEl = document.getElementById("status");
      const messagesEl = document.getElementById("messages");
      const form = document.getElementById("form");
      const messageInput = document.getElementById("message");
      const sendButton = document.getElementById("send");

      function addMessage(role, html) {
        const item = document.createElement("div");
        item.className = `msg ${role}`;
        item.innerHTML = html;
        messagesEl.appendChild(item);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function escapeHtml(text) {
        return String(text)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function renderResult(result) {
        const title = result.title || "Untitled";
        const author = result.author || "Unknown author";
        const url = result.gutenberg_url
          ? (result.gutenberg_url.startsWith("http") ? result.gutenberg_url : `https://${result.gutenberg_url}`)
          : "";
        const sourceLink = url ? `<a href="${escapeHtml(url)}" target="_blank" rel="noreferrer">Open book</a>` : "";
        return `
          <details>
            <summary>#${result.rank} score=${Number(result.score).toFixed(3)} | ${escapeHtml(title)}</summary>
            <div class="source">${escapeHtml(author)} | doc_id=${escapeHtml(result.doc_id)} ${sourceLink}</div>
            <div>${escapeHtml(result.text)}</div>
          </details>
        `;
      }

      async function loadChunkers() {
        const response = await fetch(`${apiBase}/api/chunkers`);
        const data = await response.json();
        chunkerSelect.innerHTML = "";
        for (const chunker of data.chunkers) {
          const option = document.createElement("option");
          option.value = chunker.name;
          option.textContent = `${chunker.name} (${chunker.num_chunks || 0})`;
          chunkerSelect.appendChild(option);
        }
        statusEl.textContent = data.chunkers.length ? "Ready" : "No indexes";
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const text = messageInput.value.trim();
        if (!text) return;
        messageInput.value = "";
        sendButton.disabled = true;
        statusEl.textContent = "Thinking";
        addMessage("user", escapeHtml(text));

        try {
          const response = await fetch(`${apiBase}/api/chat`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message: text,
              chunker: chunkerSelect.value,
              top_k: 5,
              use_llm: true,
            }),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || response.statusText);
          const sources = data.results.map(renderResult).join("");
          addMessage("assistant", `${escapeHtml(data.answer)}${sources}`);
          statusEl.textContent = data.used_llm ? "Gemini" : "Retrieval only";
        } catch (error) {
          addMessage("assistant", `Error: ${escapeHtml(error.message)}`);
          statusEl.textContent = "Error";
        } finally {
          sendButton.disabled = false;
        }
      });

      loadChunkers().catch((error) => {
        statusEl.textContent = "Error";
        addMessage("assistant", `Could not load chunkers: ${escapeHtml(error.message)}`);
      });
    </script>
  </body>
</html>
